[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dq-framework"
version = "0.1.0"
description = "Automated Data Quality & Self-Healing Pipeline (PySpark + Great Expectations + LLM RCA)"
requires-python = ">=3.10,<3.14"
readme = "README.md"
dependencies = [
    "pyspark==4.1.3",
    "great_expectations[spark]==1.20.0",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "PyYAML>=6.0,<7",
    "instructor>=1.4,<2",
    "openai>=1.40,<2",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
    "APScheduler>=3.10,<4",
    "watchdog>=4.0,<5",
    "fastapi>=0.112,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-mock>=3.14,<4",
]

[project.scripts]
dq = "dq_framework.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dq_framework"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "backend/tests"]
